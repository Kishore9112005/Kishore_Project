<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="Temp.css">
    <link rel="icon" href="pngtree-thermometer-icon-vector--icon-design-png-image_1978811.jpg">
</head>
<body>
    <form action="">
        <h1>🌡 Temperature Conversion 🔥</h1>
        <input type="number" id="num_box" value="0"><br>
        <input type="radio" id="fahrenheit" name="unit">
        <label for="fahrenheit">Celsius ↔ Fahrenheit</label><br>
        <input type="radio" id="celsius" name="unit">
        <label for="celsius">Fahrenheit ↔ Celsius</label><br>
        <button type="button"  onclick="convert()">Submit</button>
        <h2 id="result"></h2>
    </form>
    <script src="Temp.js"></script>
</body>
</html>
